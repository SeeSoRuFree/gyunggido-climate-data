<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해커톤 포스터 생성기 - Premium Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: #ffffff;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #6DB544, #00D9FF, #FFD96E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .controls {
            background: rgba(26, 31, 53, 0.6);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid rgba(109, 181, 68, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00D9FF;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 1rem;
            background: rgba(10, 14, 26, 0.8);
            color: #ffffff;
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover, select:focus {
            border-color: #00D9FF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #6DB544 0%, #00D9FF 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(109, 181, 68, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(109, 181, 68, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        .preview-section {
            background: rgba(26, 31, 53, 0.4);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .preview-section h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00D9FF;
            font-weight: 700;
        }

        #canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid rgba(109, 181, 68, 0.5);
            border-radius: 12px;
            box-shadow: 0 16px 64px rgba(0, 217, 255, 0.2);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .info {
            background: linear-gradient(135deg, rgba(109, 181, 68, 0.1), rgba(0, 217, 255, 0.1));
            padding: 1.2rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(109, 181, 68, 0.2);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Premium Poster Generator</h1>
        <p class="subtitle">경기도 AI 바이브코딩 해커톤 프리미엄 포스터 제작</p>

        <div class="controls">
            <div class="control-group">
                <label for="templateSelect">📐 템플릿 선택</label>
                <select id="templateSelect" onchange="generatePoster()">
                    <option value="instagram-square">인스타그램 정사각형 (1080×1080px)</option>
                    <option value="instagram-story">인스타그램 스토리 (1080×1920px)</option>
                    <option value="facebook-banner">페이스북 배너 (1200×630px)</option>
                    <option value="a4-poster">A4 포스터 (2480×3508px)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="styleSelect">🎨 스타일 선택</label>
                <select id="styleSelect" onchange="generatePoster()">
                    <option value="premium">프리미엄 모던 (Premium Modern)</option>
                    <option value="tech">테크 홀로그램 (Tech Holographic)</option>
                </select>
            </div>

            <div class="info">
                💎 프리미엄 디자인이 자동 생성됩니다. 아래 버튼으로 고해상도 이미지를 다운로드하세요.
            </div>
        </div>

        <div class="preview-section">
            <h3>🎨 미리보기</h3>
            <canvas id="canvas"></canvas>

            <div class="button-group">
                <button onclick="downloadImage('png')">⬇️ PNG 다운로드 (투명배경)</button>
                <button onclick="downloadImage('jpg')">⬇️ JPG 다운로드 (고화질)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const templates = {
            'instagram-square': { width: 1080, height: 1080 },
            'instagram-story': { width: 1080, height: 1920 },
            'facebook-banner': { width: 1200, height: 630 },
            'a4-poster': { width: 2480, height: 3508 }
        };

        function drawModernBackground(width, height, isVertical) {
            // 베이스 다크 그라데이션
            const bgGrad = ctx.createLinearGradient(0, 0, width, height);
            bgGrad.addColorStop(0, '#0a0e1a');
            bgGrad.addColorStop(0.5, '#141824');
            bgGrad.addColorStop(1, '#0a0e1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 대각선 그라데이션 오버레이
            ctx.globalCompositeOperation = 'lighten';
            const diagonalGrad = ctx.createLinearGradient(0, 0, width, height);
            diagonalGrad.addColorStop(0, 'rgba(109, 181, 68, 0.15)');
            diagonalGrad.addColorStop(0.5, 'rgba(0, 217, 255, 0.08)');
            diagonalGrad.addColorStop(1, 'rgba(255, 217, 110, 0.1)');
            ctx.fillStyle = diagonalGrad;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';

            // 유기적인 블러 원형들 (Glassmorphism)
            ctx.globalAlpha = 0.15;
            const blobs = [
                { x: width * 0.15, y: height * 0.2, r: 400, color: '#6DB544' },
                { x: width * 0.85, y: height * 0.75, r: 350, color: '#00D9FF' },
                { x: width * 0.5, y: height * 0.5, r: 300, color: '#FFD96E' }
            ];

            blobs.forEach(blob => {
                const blobGrad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.r);
                blobGrad.addColorStop(0, blob.color);
                blobGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = blobGrad;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 그리드 패턴 (미세)
            ctx.strokeStyle = 'rgba(109, 181, 68, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // 기하학 도형 (대각선 라인)
            ctx.strokeStyle = 'rgba(0, 217, 255, 0.1)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(width * 0.1, height * 0.3);
            ctx.lineTo(width * 0.4, height * 0.1);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 217, 110, 0.12)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(width * 0.7, height * 0.85);
            ctx.lineTo(width * 0.95, height * 0.7);
            ctx.stroke();
        }

        function drawTechBackground(width, height, isVertical) {
            // 베이스 다크 블루 그라데이션 (사이버펑크 느낌)
            const bgGrad = ctx.createLinearGradient(0, 0, width, height);
            bgGrad.addColorStop(0, '#001a2e');
            bgGrad.addColorStop(0.5, '#002440');
            bgGrad.addColorStop(1, '#001528');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            const scale = width / 1080;

            // 네트워크 그리드 패턴 (강조된)
            ctx.strokeStyle = 'rgba(0, 217, 255, 0.15)';
            ctx.lineWidth = 2;
            const gridSize = 80 * scale;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // 그리드 교차점에 네온 도트
            ctx.fillStyle = 'rgba(0, 217, 255, 0.4)';
            for (let x = 0; x < width; x += gridSize) {
                for (let y = 0; y < height; y += gridSize) {
                    ctx.beginPath();
                    ctx.arc(x, y, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 홀로그램 블러 효과 (네온 그린/시안)
            ctx.globalAlpha = 0.08;
            const holoBlobs = [
                { x: width * 0.2, y: height * 0.3, r: 350 * scale, color: '#6DB544' },
                { x: width * 0.8, y: height * 0.7, r: 400 * scale, color: '#00D9FF' },
                { x: width * 0.5, y: height * 0.5, r: 300 * scale, color: '#1297A3' }
            ];

            holoBlobs.forEach(blob => {
                const blobGrad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.r);
                blobGrad.addColorStop(0, blob.color);
                blobGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = blobGrad;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 대각선 네온 라인 (홀로그램 UI 요소)
            const neonLines = [
                { x1: width * 0.05, y1: height * 0.2, x2: width * 0.35, y2: height * 0.1, color: '#00D9FF', width: 3 },
                { x1: width * 0.65, y1: height * 0.15, x2: width * 0.95, y2: height * 0.25, color: '#6DB544', width: 2.5 },
                { x1: width * 0.1, y1: height * 0.75, x2: width * 0.3, y2: height * 0.9, color: '#FFD96E', width: 2 },
                { x1: width * 0.7, y1: height * 0.85, x2: width * 0.95, y2: height * 0.75, color: '#00D9FF', width: 2.5 }
            ];

            neonLines.forEach(line => {
                ctx.strokeStyle = line.color;
                ctx.lineWidth = line.width * scale;
                ctx.shadowColor = line.color;
                ctx.shadowBlur = 15 * scale;
                ctx.beginPath();
                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // 기하학 도형 (테크 프레임)
            ctx.strokeStyle = 'rgba(0, 217, 255, 0.3)';
            ctx.lineWidth = 3 * scale;
            ctx.shadowColor = '#00D9FF';
            ctx.shadowBlur = 10 * scale;

            // 좌측 상단 코너
            ctx.beginPath();
            ctx.moveTo(width * 0.05, height * 0.12);
            ctx.lineTo(width * 0.05, height * 0.08);
            ctx.lineTo(width * 0.12, height * 0.08);
            ctx.stroke();

            // 우측 하단 코너
            ctx.beginPath();
            ctx.moveTo(width * 0.95, height * 0.88);
            ctx.lineTo(width * 0.95, height * 0.92);
            ctx.lineTo(width * 0.88, height * 0.92);
            ctx.stroke();

            ctx.shadowBlur = 0;

            // 파티클 효과 (작은 네온 점들)
            ctx.fillStyle = 'rgba(109, 181, 68, 0.6)';
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const size = (Math.random() * 2 + 1) * scale;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(0, 217, 255, 0.5)';
            for (let i = 0; i < 25; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const size = (Math.random() * 2 + 1) * scale;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function generatePoster() {
            const template = document.getElementById('templateSelect').value;
            const style = document.getElementById('styleSelect').value;
            const size = templates[template];

            canvas.width = size.width;
            canvas.height = size.height;

            const isVertical = size.height > size.width;
            const scale = size.width / 1080;

            // 배경 그리기
            if (style === 'tech') {
                drawTechBackground(canvas.width, canvas.height, isVertical);
            } else {
                drawModernBackground(canvas.width, canvas.height, isVertical);
            }

            // 텍스트 설정
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 스타일별 색상 설정
            const colors = style === 'tech' ? {
                badge: '#00D9FF',
                badgeShadow: 'rgba(0, 217, 255, 0.8)',
                primary: '#ffffff',
                primaryShadow: 'rgba(0, 217, 255, 0.5)',
                gradientStart: '#00D9FF',
                gradientMid: '#6DB544',
                gradientEnd: '#FFD96E',
                gradientShadow: 'rgba(0, 217, 255, 0.8)',
                subtitle: 'rgba(255, 255, 255, 0.9)'
            } : {
                badge: '#FFD96E',
                badgeShadow: 'rgba(255, 217, 110, 0.5)',
                primary: '#ffffff',
                primaryShadow: 'rgba(255, 255, 255, 0.3)',
                gradientStart: '#6DB544',
                gradientMid: '#00D9FF',
                gradientEnd: '#FFD96E',
                gradientShadow: 'rgba(109, 181, 68, 0.6)',
                subtitle: 'rgba(255, 255, 255, 0.8)'
            };

            // 상단 배지
            const badgeY = 120 * scale;
            ctx.font = `700 ${28 * scale}px 'Inter'`;
            ctx.fillStyle = colors.badge;
            ctx.shadowColor = colors.badgeShadow;
            ctx.shadowBlur = style === 'tech' ? 30 * scale : 20 * scale;
            ctx.fillText('🚀 경기기후위성 발사 기념', canvas.width / 2, badgeY);
            ctx.shadowBlur = 0;

            // 메인 타이틀 시작 위치
            const titleStartY = isVertical ? canvas.height * 0.35 : canvas.height * 0.4;

            // "경기도 AI" 텍스트
            ctx.font = `900 ${isVertical ? 90 : 70}px 'Outfit'`;
            ctx.fillStyle = colors.primary;
            ctx.shadowColor = colors.primaryShadow;
            ctx.shadowBlur = 30 * scale;
            ctx.fillText('경기도 AI', canvas.width / 2, titleStartY);
            ctx.shadowBlur = 0;

            // "바이브코딩 해커톤" - 그라데이션
            ctx.font = `900 ${isVertical ? 100 : 80}px 'Outfit'`;
            const titleGrad = ctx.createLinearGradient(
                canvas.width * 0.3, titleStartY + 100 * scale,
                canvas.width * 0.7, titleStartY + 140 * scale
            );
            titleGrad.addColorStop(0, colors.gradientStart);
            titleGrad.addColorStop(0.5, colors.gradientMid);
            titleGrad.addColorStop(1, colors.gradientEnd);
            ctx.fillStyle = titleGrad;
            ctx.shadowColor = colors.gradientShadow;
            ctx.shadowBlur = style === 'tech' ? 50 * scale : 40 * scale;
            ctx.fillText('바이브코딩', canvas.width / 2, titleStartY + 120 * scale);
            ctx.fillText('해커톤', canvas.width / 2, titleStartY + 230 * scale);
            ctx.shadowBlur = 0;

            // 서브 타이틀
            const subY = titleStartY + 340 * scale;
            ctx.font = `600 ${24 * scale}px 'Inter'`;
            ctx.fillStyle = colors.subtitle;
            if (style === 'tech') {
                ctx.shadowColor = 'rgba(0, 217, 255, 0.4)';
                ctx.shadowBlur = 15 * scale;
            }
            ctx.fillText('경기기후플랫폼 실제 데이터 × AI 협업', canvas.width / 2, subY);
            ctx.shadowBlur = 0;

            // 정보 섹션 - 모던 카드 스타일
            const infoY = isVertical ? canvas.height * 0.7 : canvas.height * 0.75;
            const cardWidth = canvas.width * 0.8;
            const cardHeight = isVertical ? 300 * scale : 180 * scale;
            const cardX = (canvas.width - cardWidth) / 2;
            const cardY = infoY - cardHeight / 2;

            // 카드 배경 (Glassmorphism)
            if (style === 'tech') {
                ctx.fillStyle = 'rgba(0, 26, 46, 0.7)';
                ctx.strokeStyle = 'rgba(0, 217, 255, 0.6)';
                ctx.lineWidth = 3;
                ctx.shadowColor = 'rgba(0, 217, 255, 0.5)';
                ctx.shadowBlur = 40 * scale;
            } else {
                ctx.fillStyle = 'rgba(26, 31, 53, 0.6)';
                ctx.strokeStyle = 'rgba(109, 181, 68, 0.4)';
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(0, 217, 255, 0.3)';
                ctx.shadowBlur = 30 * scale;
            }
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 24);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 날짜 정보
            ctx.font = `800 ${42 * scale}px 'Outfit'`;
            ctx.fillStyle = style === 'tech' ? '#00D9FF' : '#00D9FF';
            if (style === 'tech') {
                ctx.shadowColor = '#00D9FF';
                ctx.shadowBlur = 20 * scale;
            }
            ctx.fillText('12.13 SAT', canvas.width / 2, infoY - 50 * scale);
            ctx.shadowBlur = 0;

            ctx.font = `600 ${26 * scale}px 'Inter'`;
            ctx.fillStyle = '#ffffff';
            if (style === 'tech') {
                ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                ctx.shadowBlur = 10 * scale;
            }
            ctx.fillText('9:00 ~ 16:00', canvas.width / 2, infoY + 5 * scale);
            ctx.shadowBlur = 0;

            ctx.font = `500 ${22 * scale}px 'Inter'`;
            ctx.fillStyle = style === 'tech' ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 255, 255, 0.85)';
            ctx.fillText('경기도의회 중회의실(지하1층)', canvas.width / 2, infoY + 50 * scale);

            // 하단 정보
            const bottomY = canvas.height - 100 * scale;
            ctx.font = `600 ${18 * scale}px 'Inter'`;
            ctx.fillStyle = style === 'tech' ? 'rgba(255, 255, 255, 0.6)' : 'rgba(255, 255, 255, 0.5)';
            ctx.fillText('주최 경기도  |  운영 Second Team', canvas.width / 2, bottomY);

            ctx.font = `700 ${20 * scale}px 'Inter'`;
            ctx.fillStyle = style === 'tech' ? '#00D9FF' : '#00D9FF';
            if (style === 'tech') {
                ctx.shadowColor = '#00D9FF';
                ctx.shadowBlur = 15 * scale;
            }
            ctx.fillText('climate-gg.second-team.com', canvas.width / 2, bottomY + 35 * scale);
            ctx.shadowBlur = 0;

            // 액센트 도형 (우측 하단)
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = style === 'tech' ? '#00D9FF' : '#6DB544';
            ctx.beginPath();
            ctx.moveTo(canvas.width - 100 * scale, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(canvas.width, canvas.height - 100 * scale);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function downloadImage(format) {
            const link = document.createElement('a');
            const template = document.getElementById('templateSelect').value;
            const style = document.getElementById('styleSelect').value;
            const fileName = `hackathon-poster-${style}-${template}.${format}`;

            if (format === 'jpg') {
                link.download = fileName;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
            } else {
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
            }

            link.click();
        }

        // 폰트 로딩 후 초기 생성
        document.fonts.ready.then(() => {
            generatePoster();
        });
    </script>
</body>
</html>
